server:
  shutdown: immediate

management.endpoint:
  health.cache.time-to-live: 0
  info.cache.time-to-live: 0

hmpps-auth:
  url: "http://localhost:8090/auth"


springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
spring:
  #cloud:
    #aws:
      #region:
        #static: eu-west-2
      #credentials:
        #access-key: test
        #secret-key: test
      #sqs:
        #endpoint: http://localhost:4566
  ai:
    openai:
      api-key: randomValue
      chat:
        base-url: http://localhost:8091
        model: test-model-x
        store: false
  r2dbc:
    pool:
      enabled: true
  #url: r2dbc:pool:postgresql://localhost/jdatest?sslMode=prefer
    #username: sa
    #password: password
  #jpa:
    #hibernate:
      #ddl-auto: update
    #show-sql: false
    #properties:
      #hibernate:
        #dialect: org.hibernate.dialect.H2Dialect
    #defer-datasource-initialization: true
  #datasource:
    #username: sa
    #password: password
    #url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    #driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    #url: jdbc:postgresql://localhost/jdatest?sslmode=prefer
    #user: sa
    #password: test
    locations: classpath:db/migration/dev
    baseline-on-migrate: true


logging:
  level:
    db:
      migration: DEBUG

hmpps:
  sqs:
    enabled: true
    provider: localstack
    localstackUrl: http://localhost:4566
    region: eu-west-2
    queues:
      jdarequestqueus:
        queuename: sqs_request_queue_name
        dlqName: sqs_request_dlq_queue_name
        #subscribeTopicId: jdaevents
      jdaresponsequeus:
        queuename: sqs_response_queue_name
        dlqName: sqs_response_dlq_queue_name
        #subscribeTopicId: jdaevents
    #topics:
      #jdaevents:
        #arn: arn:aws:sns:XXX-REGION:YYYY:jdaevents-topic

  ai-gateway:
    api-key: randomValue
    base-url: http://localhost:8091
