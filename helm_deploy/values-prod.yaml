---
# Per environment values which override defaults in hmpps-justice-data-agent-worker/values.yaml

generic-service:
  ingress:
    host: justice-data-agent-worker.hmpps.service.justice.gov.uk

  env:
    SPRING_PROFILES_ACTIVE: "prod"
    HMPPS_AUTH_URL: "https://sign-in.hmpps.service.justice.gov.uk/auth"

  namespace_secrets:
    sqs-jda-request-queue-secret:
      HMPPS_JDA_REQUEST_QUEUE_NAME: "sqs_queue_name"
      HMPPS_JDA_REQUEST_DLQ_NAME: "sqs_dlq_name"
    sqs-jda-response-queue-secret:
      HMPPS_JDA_RESPONSE_QUEUE_NAME: "sqs_queue_name"
      HMPPS_JDA_RESPONSE_DLQ_NAME: "sqs_dlq_name"
    rds-postgresql-read-replica-output:
      DB_READ_ENDPOINT: "rds_instance_endpoint"

  postgresDatabaseRestore:
    jobName: jda-prod-to-preprod-restore
    enabled: true
    # schedule: "0 2 1,15 * *"
    timeout: 900
    namespace_secrets:
      rds-postgresql-instance-output:
        DB_NAME: "database_name"
        DB_USER: "database_username"
        DB_PASS: "database_password"
        DB_HOST: "rds_instance_address"
      rds-postgresql-instance-output-preprod:
        DB_NAME_PREPROD: "database_name"
        DB_USER_PREPROD: "database_username"
        DB_PASS_PREPROD: "database_password"
        DB_HOST_PREPROD: "rds_instance_address"

# CloudPlatform AlertManager receiver to route prometheus alerts to slack
# See https://user-guide.cloud-platform.service.justice.gov.uk/documentation/monitoring-an-app/how-to-create-alarms.html#creating-your-own-custom-alerts
generic-prometheus-alerts:
  alertSeverity: information
